<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Quản Lý Báo Cáo Ngày</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =====================================
       MANAGER
    ===================================== */

    .manager-card {
      max-width: 1250px;
      margin: auto;
    }

    /* =====================================
       HEADER + MENU
    ===================================== */

    .manager-header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: none;
    }

    .menu-button:active {
      transform: scale(.96);
    }

    /* =====================================
       SIDE MENU
    ===================================== */

    .side-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 99998;
      display: none;
    }

    .side-menu-overlay.open {
      display: block;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: min(320px, 85vw);
      height: 100%;
      background: white;
      z-index: 99999;
      box-shadow: 10px 0 40px rgba(0,0,0,.25);
      transform: translateX(-100%);
      transition: transform .25s ease;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu-header {
      padding: 20px;
      background: #2563eb;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .side-menu-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .side-menu-close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.2);
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .side-menu-list {
      padding: 12px;
    }

    .side-menu-item {
      width: 100%;
      min-height: 52px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 12px;
      background: #f1f5f9;
      color: #1e293b;
      text-align: left;
      padding: 12px 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .side-menu-item:hover {
      background: #e2e8f0;
    }

    .side-menu-item:active {
      transform: scale(.98);
    }

    /* =====================================
       STATS
    ===================================== */

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-title {
      color: #64748b;
      font-size: 14px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    /* =====================================
       FILTER
    ===================================== */

    .filters {
      display: grid;
      gap: 10px;
    }

    /* =====================================
       TABLE
    ===================================== */

    .table-wrap {
      overflow-x: auto;
      margin-top: 20px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1450px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f5f9;
      font-weight: 800;
    }

    /* =====================================
       BUTTON
    ===================================== */

    .danger {
      background: #dc2626;
    }

    .green {
      background: #16a34a;
    }

    .gray {
      background: #64748b;
    }

    .edit-btn {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 5px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-btn:active,
    .delete-btn:active {
      transform: scale(.97);
    }

    /* =====================================
       MESSAGE
    ===================================== */

    #managerMessage,
    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    /* =====================================
       PAGINATION
    ===================================== */

    #pagination {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 5px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    #pagination button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: white;
      color: #334155;
      font-size: 14px;
      cursor: pointer;
      box-shadow: none;
    }

    #pagination button:hover {
      background: #f1f5f9;
    }

    #pagination button.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      font-weight: bold;
    }

    #pagination button.arrow {
      font-size: 20px;
      font-weight: bold;
    }

    #pagination button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* =====================================
       CÁN BỘ ĐÃ NHẬP
    ===================================== */

    #showSubmittedUsersBtn {
      font-weight: 800;
    }

    #submittedUserCount {
      font-weight: 900;
      background: white;
      color: #2563eb;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 4px;
    }

    /* =====================================
       MODAL CÁN BỘ
    ===================================== */

    .user-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 99999;
    }

    .user-modal {
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .user-modal-header {
      padding: 18px;
      background: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .user-modal-header h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
    }

    .user-modal-close {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: none;
    }

    .user-modal-body {
      padding: 15px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .submitted-user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
    }

    .submitted-user-number {
      min-width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-weight: 800;
    }

    .no-user {
      text-align: center;
      padding: 30px 10px;
      color: #64748b;
      font-weight: 600;
    }

    /* =====================================
       PERMISSION MODAL
    ===================================== */

    .permission-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      z-index: 100001;
    }

    .permission-modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .permission-header {
      padding: 18px;
      background: #2563eb;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .permission-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .permission-close {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.2);
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .permission-body {
      padding: 18px;
      max-height: 75vh;
      overflow-y: auto;
    }

    .permission-info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .permission-form {
      display: grid;
      gap: 10px;
    }

    .permission-form label {
      font-weight: 800;
      color: #334155;
    }

    .permission-form input {
      width: 100%;
      height: 50px;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 16px;
      outline: none;
    }

    .permission-form input:focus {
      border-color: #2563eb;
    }

    .permission-list-title {
      margin-top: 22px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 900;
    }

    .permission-user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      margin-bottom: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .permission-user-info {
      min-width: 0;
      flex: 1;
    }

    .permission-user-name {
      font-weight: 900;
      color: #0f172a;
      word-break: break-word;
    }

    .permission-user-status {
      font-size: 12px;
      color: #16a34a;
      margin-top: 3px;
      font-weight: 700;
    }

    .revoke-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 9px;
      background: #dc2626;
      color: white;
      padding: 9px 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .revoke-btn:active {
      transform: scale(.97);
    }

    .permission-empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    /* =====================================
       EDIT MODAL
    ===================================== */

    .edit-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 100000;
    }

    .edit-modal {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .edit-modal h2 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .edit-modal input {
      width: 100%;
      height: 52px;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
      box-sizing: border-box;
    }

    .edit-modal input:focus {
      border-color: #2563eb;
    }

    .edit-modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .edit-save-btn {
      background: #16a34a;
    }

    .edit-cancel-btn {
      background: #64748b;
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width:600px) {

      .stats {
        grid-template-columns: 1fr;
      }

      #pagination {
        gap: 4px;
      }

      #pagination button {
        width: 34px;
        height: 34px;
      }

      .user-modal-overlay,
      .edit-modal-overlay,
      .permission-modal-overlay {
        padding: 10px;
      }

      .user-modal {
        max-height: 88vh;
      }

      .user-modal-body {
        max-height: 68vh;
      }

      .edit-modal {
        padding: 17px;
      }

      .permission-modal {
        max-height: 92vh;
      }

      .permission-body {
        max-height: 78vh;
      }

      .permission-user {
        align-items: flex-start;
      }

      .revoke-btn {
        padding: 8px;
        font-size: 12px;
      }

    }

  </style>

</head>


<body>

  <main class="container manager-card">

    <section class="card">

      <!-- =================================
           HEADER
      ================================= -->

      <div class="manager-header">

        <button
          id="menuBtn"
          class="menu-button"
          type="button"
          style="display:none"
        >
          ☰
        </button>

        <div class="header">

          <div class="logo">
            📊
          </div>

          <div>

            <h1>
              QUẢN LÝ BÁO CÁO NGÀY
            </h1>

            <p>
              Theo dõi và xuất báo cáo
            </p>

          </div>

        </div>

      </div>


      <!-- =================================
           LOGIN
      ================================= -->

      <div id="loginBox">

        <div class="field">

          <label>
            User / Email
          </label>

          <input
            id="loginId"
            type="text"
            placeholder="Nhập user hoặc email"
            autocomplete="username"
          >

        </div>


        <div class="field">

          <label>
            Mật khẩu
          </label>

          <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
          >

        </div>


        <button id="loginBtn">
          🔐 ĐĂNG NHẬP
        </button>


        <div id="loginMessage"></div>

      </div>


      <!-- =================================
           MANAGER
      ================================= -->

      <div
        id="managerBox"
        style="display:none"
      >

        <button
          id="logoutBtn"
          class="danger"
        >
          🚪 ĐĂNG XUẤT
        </button>


        <!-- =================================
             STATS
        ================================= -->

        <div class="stats">

          <div class="stat">

            <div class="stat-title">
              Tổng báo cáo
            </div>

            <div
              class="stat-value"
              id="totalReports"
            >
              0
            </div>

          </div>


          <div class="stat">

            <div class="stat-title">
              Tổng dự thu
            </div>

            <div
              class="stat-value"
              id="totalAmount"
            >
              0 đ
            </div>

          </div>

        </div>


        <!-- =================================
             FILTER
        ================================= -->

        <div class="section-title">
          🔎 BỘ LỌC
        </div>


        <div class="filters">

          <label>
            Lọc theo cán bộ
          </label>

          <input
            id="filterUser"
            type="text"
            placeholder="Nhập tên cán bộ"
          >


          <label>
            Lọc theo ngày field
          </label>

          <input
            id="filterDate"
            type="date"
          >


          <button
            id="filterBtn"
            class="gray"
          >
            🔎 LỌC DỮ LIỆU
          </button>


          <button
            id="refreshBtn"
            class="green"
          >
            🔄 LÀM MỚI
          </button>


          <button id="exportBtn">
            📥 XUẤT EXCEL
          </button>


          <button
            id="showSubmittedUsersBtn"
            class="gray"
          >
            👥 CÁN BỘ ĐÃ NHẬP BÁO CÁO
            (<span id="submittedUserCount">0</span>)
          </button>

        </div>


        <!-- =================================
             TABLE
        ================================= -->

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Cán bộ</th>
                <th>Ngày field</th>
                <th>Số CIF</th>
                <th>Tên khách hàng</th>
                <th>Kết quả</th>
                <th>Kết nối</th>
                <th>Kết quả chi tiết</th>
                <th>Dự thu</th>
                <th>Hướng tác động tiếp theo</th>
                <th>Thao tác</th>

              </tr>

            </thead>


            <tbody id="tableBody"></tbody>

          </table>

        </div>


        <div id="pagination"></div>

        <div id="managerMessage"></div>

      </div>

    </section>

  </main>


  <!-- =================================
       SIDE MENU
  ================================= -->

  <div
    id="sideMenuOverlay"
    class="side-menu-overlay"
  ></div>


  <aside
    id="sideMenu"
    class="side-menu"
  >

    <div class="side-menu-header">

      <h2>☰ MENU</h2>

      <button
        id="sideMenuClose"
        class="side-menu-close"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="side-menu-list">

      <button
        id="menuReportsBtn"
        class="side-menu-item"
        type="button"
      >
        📊 Quản lý báo cáo
      </button>


      <button
        id="menuPermissionBtn"
        class="side-menu-item"
        type="button"
      >
        🔐 Phân quyền
      </button>


      <button
        id="menuLogoutBtn"
        class="side-menu-item"
        type="button"
      >
        🚪 Đăng xuất
      </button>

    </div>

  </aside>


  <!-- =================================
       LIBRARIES
  ================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script src="config.js"></script>

  <script src="manager.js"></script>

</body>

</html>
