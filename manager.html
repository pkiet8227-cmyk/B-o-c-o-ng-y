<!doctype html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>Quản Lý Báo Cáo Ngày</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .manager-card {
      max-width: 1250px;
      margin: auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-title {
      color: #64748b;
      font-size: 14px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    .filters {
      display: grid;
      gap: 10px;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1300px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 9px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f5f9;
    }

    .danger {
      background: #dc2626;
    }

    .green {
      background: #16a34a;
    }

    .gray {
      background: #64748b;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #managerMessage,
    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    /*
      PHÂN TRANG
      Không cần sửa style.css
      manager.js sẽ tự tạo nút phân trang
    */

    #pagination {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 5px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    #pagination button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: white;
      color: #334155;
      font-size: 14px;
      cursor: pointer;
    }

    #pagination button:hover {
      background: #f1f5f9;
    }

    #pagination button.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      font-weight: bold;
    }

    #pagination button.arrow {
      font-size: 20px;
      font-weight: bold;
    }

    #pagination button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    @media (max-width:600px) {

      .stats {
        grid-template-columns: 1fr;
      }

      #pagination {
        gap: 4px;
      }

      #pagination button {
        width: 34px;
        height: 34px;
      }

    }

  </style>

</head>


<body>

<main class="container manager-card">

  <section class="card">

    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        📊
      </div>

      <div>

        <h1>
          QUẢN LÝ BÁO CÁO NGÀY
        </h1>

        <p>
          Theo dõi và xuất báo cáo
        </p>

      </div>

    </div>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="loginBox">

      <div class="field">

        <label>
          Email quản lý
        </label>

        <input
          id="email"
          type="email"
          placeholder="Nhập email">

      </div>


      <div class="field">

        <label>
          Mật khẩu
        </label>

        <input
          id="password"
          type="password"
          placeholder="Nhập mật khẩu">

      </div>


      <button id="loginBtn">

        🔐 ĐĂNG NHẬP

      </button>


      <div id="loginMessage"></div>

    </div>


    <!-- ========================= -->
    <!-- QUẢN LÝ -->
    <!-- ========================= -->

    <div
      id="managerBox"
      style="display:none">


      <!-- ĐĂNG XUẤT -->

      <button
        id="logoutBtn"
        class="danger">

        🚪 ĐĂNG XUẤT

      </button>


      <!-- ========================= -->
      <!-- THỐNG KÊ -->
      <!-- ========================= -->

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Tổng báo cáo
          </div>

          <div
            class="stat-value"
            id="totalReports">

            0

          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Tổng dự thu
          </div>

          <div
            class="stat-value"
            id="totalAmount">

            0 đ

          </div>

        </div>

      </div>


      <!-- ========================= -->
      <!-- BỘ LỌC -->
      <!-- ========================= -->

      <div class="section-title">
        🔎 BỘ LỌC
      </div>


      <div class="filters">

        <label>
          Lọc theo cán bộ
        </label>

        <input
          id="filterUser"
          type="text"
          placeholder="Nhập tên cán bộ">


        <label>
          Lọc theo ngày field
        </label>

        <input
          id="filterDate"
          type="date">


        <button
          id="filterBtn"
          class="gray">

          🔎 LỌC DỮ LIỆU

        </button>


        <button
          id="refreshBtn"
          class="green">

          🔄 LÀM MỚI

        </button>


        <button
          id="exportBtn">

          📥 XUẤT EXCEL

        </button>

      </div>


      <!-- ========================= -->
      <!-- BẢNG DỮ LIỆU -->
      <!-- ========================= -->

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                Cán bộ
              </th>

              <th>
                Ngày field
              </th>

              <th>
                Số CIF
              </th>

              <th>
                Tên khách hàng
              </th>

              <th>
                Kết quả
              </th>

              <th>
                Kết nối
              </th>

              <th>
                Kết quả chi tiết
              </th>

              <th>
                Dự thu
              </th>

              <th>
                Hướng tác động tiếp theo
              </th>

              <th>
                Xóa
              </th>

            </tr>

          </thead>


          <tbody id="tableBody">

          </tbody>

        </table>

      </div>


      <!-- ========================= -->
      <!-- PHÂN TRANG -->
      <!-- ========================= -->

      <div id="pagination"></div>


      <!-- ========================= -->
      <!-- THÔNG BÁO -->
      <!-- ========================= -->

      <div id="managerMessage"></div>


    </div>

  </section>

</main>


<!-- ========================= -->
<!-- SUPABASE -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ========================= -->
<!-- XUẤT EXCEL -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="config.js"></script>


<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="manager.js"></script>


</body>

</html>
